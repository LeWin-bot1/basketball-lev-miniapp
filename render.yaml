services:
  - type: web
    name: basketball-lev-bot
    runtime: python
    plan: free  # для постоянной базы: Starter + Disk (см. ниже)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # На платном тарифе (Starter) раскомментировать и добавить DB_PATH=/var/data/lev_game.db:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_TOKEN
        sync: false
      - key: PROVIDER_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: CRYPTO_PAY_TOKEN
        sync: false
      - key: CRYPTO_PAY_NETWORK
        value: testnet
