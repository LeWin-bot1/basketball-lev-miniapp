# Автосборка Mini App: после каждого изменения фронтенда собирает его
# и кладёт готовую версию в miniapp/frontend/dist (её раздаёт Render).
# Журнал сборки сохраняется в ветку ci-logs (build.log).
name: Build Mini App

on:
  push:
    branches: [main]
    paths:
      - "miniapp/frontend/**"
      - "!miniapp/frontend/dist/**"
      - ".github/workflows/build-miniapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-miniapp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/frontend/package-lock.json

      - name: Build
        id: build
        working-directory: miniapp/frontend
        shell: bash
        run: |
          set -o pipefail
          {
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u)"
            npm ci --no-audit --no-fund && npm run build
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        continue-on-error: true

      - name: Commit built Mini App
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A miniapp/frontend/dist
          if git diff --cached --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build: Mini App (${GITHUB_SHA::7})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Save build log to ci-logs branch
        if: always()
        shell: bash
        run: |
          echo "result: ${{ steps.build.outcome }}" >> build.log
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -q -m "build log ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
